services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: campus_cab
      MYSQL_USER: campus_cab
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/campus_cab?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: campus_cab
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      OTP_MODE: ${OTP_MODE:-twilio}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build: .
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - backend
volumes:
  mysql_data:
